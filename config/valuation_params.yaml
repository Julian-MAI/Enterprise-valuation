# 企业估值核心参数配置
# 数据来源：央行2025年金融市场运行报告、德安華行业估值报告、东方财富Choice数据

# ===== 无风险利率配置 =====
risk_free_rate:
  # 中国10年期国债收益率（单位：%）
  # 爬取失败时的默认值
  default: 1.85

# ===== 市场风险溢价配置 =====
market_risk_premium:
  # A股市场风险溢价（单位：%）
  default: 6.0

# ===== Beta估计配置 =====
beta:
  # 计算方法：industry (行业Beta+杠杆调整) 或 custom (自定义)
  method: industry
  # 无杠杆Beta参考值（行业默认）
  industry_unlevered_beta:
    制造业: 1.0
    信息技术: 1.3
    金融业: 0.8
    房地产: 1.2
    零售业: 1.0
    能源: 1.1
    医药生物: 0.95
    其他: 1.0
  # 自定义Beta（method为custom时使用）
  custom: 1.0

# ===== WACC计算配置 =====
wacc:
  # 默认WACC（%）
  default: 9.0
  # 债务成本（%）
  cost_of_debt: 3.0
  # 税率（%）
  tax_rate: 25.0

# ===== 永续增长率配置 =====
perpetual_growth_rate:
  # 各行业永续增长率区间（%）
  ranges:
    制造业: [1.5, 2.5]
    信息技术: [2.5, 3.5]
    金融业: [1.0, 2.0]
    房地产: [0.0, 1.0]
    零售业: [1.0, 2.0]
    能源: [1.0, 2.0]
    医药生物: [2.0, 3.0]
    其他: [1.5, 2.5]
  # 默认值
  default: 2.0

# ===== 行业估值倍数配置 =====
industry_multiples:
  # 市盈率 (PE)
  pe:
    制造业: 20
    信息技术: 50
    金融业: 7
    房地产: 5
    零售业: 18
    能源: 12
    医药生物: 25
    其他: 20
  # 市销率 (PS)
  ps:
    制造业: 1.5
    信息技术: 5.0
    金融业: 1.0
    房地产: 0.8
    零售业: 1.2
    能源: 1.0
    医药生物: 3.0
    其他: 2.0
  # 企业价值/EBITDA (EV/EBITDA)
  ev_ebitda:
    制造业: 12
    信息技术: 20
    金融业: 8
    房地产: 6
    零售业: 10
    能源: 8
    医药生物: 15
    其他: 12